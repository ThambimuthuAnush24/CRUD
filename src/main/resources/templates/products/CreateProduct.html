<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Product</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      body {
        background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 35%, #e0f2fe 100%);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      .input-field {
        transition: all 0.2s ease;
      }
      .input-field:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
      }
      .error-message {
        color: #e11d48;
        font-size: 0.75rem;
        margin-top: 0.35rem;
      }
    </style>
  </head>
  <body class="min-h-screen py-10">
    <div class="mx-auto max-w-5xl px-4">
      <div class="overflow-hidden rounded-[28px] border border-white/60 bg-white/80 shadow-2xl shadow-slate-200/70 backdrop-blur-sm">
        <div class="flex items-center justify-between bg-gradient-to-r from-indigo-600 via-blue-600 to-cyan-500 px-6 py-5 text-white md:px-8">
          <div>
            <p class="text-xs font-semibold uppercase tracking-[0.25em] text-indigo-100">Catalog</p>
            <h1 class="mt-2 text-2xl font-black md:text-3xl"><i class="fas fa-plus-circle mr-2"></i>Create product</h1>
          </div>
          <a href="/products" class="rounded-full border border-white/30 bg-white/10 px-4 py-2 text-sm font-medium transition hover:bg-white/20">
            <i class="fas fa-arrow-left mr-2"></i>Back
          </a>
        </div>

        <form th:action="@{/products/create}" th:object="${productDto}" method="post" enctype="multipart/form-data" class="grid gap-8 px-6 py-8 md:grid-cols-[1.2fr_0.8fr] md:px-8" id="productForm">
          <div class="space-y-6">
            <div>
              <label class="mb-2 block text-sm font-semibold text-slate-700" for="name"><i class="fas fa-tag mr-2 text-indigo-500"></i>Name</label>
              <input class="input-field w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-800 outline-none" type="text" id="name" th:field="*{name}" placeholder="Enter product name" required />
              <div class="error-message" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="grid gap-6 md:grid-cols-2">
              <div>
                <label class="mb-2 block text-sm font-semibold text-slate-700" for="brand"><i class="fas fa-building mr-2 text-indigo-500"></i>Brand</label>
                <input class="input-field w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-800 outline-none" type="text" id="brand" th:field="*{brand}" placeholder="Enter brand name" required />
                <div class="error-message" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></div>
              </div>

              <div>
                <label class="mb-2 block text-sm font-semibold text-slate-700" for="category"><i class="fas fa-list-alt mr-2 text-indigo-500"></i>Category</label>
                <select class="input-field w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-800 outline-none" id="category" th:field="*{category}" required>
                  <option value="">Select a category</option>
                  <option value="Laptop">Laptop</option>
                  <option value="Mobilephone">Mobilephone</option>
                  <option value="Earphone">Earphone</option>
                  <option value="Charger">Charger</option>
                  <option value="Television">Television</option>
                </select>
                <div class="error-message" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
              </div>
            </div>

            <div>
              <label class="mb-2 block text-sm font-semibold text-slate-700" for="price"><i class="fas fa-dollar-sign mr-2 text-indigo-500"></i>Price</label>
              <input class="input-field w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-800 outline-none" type="number" id="price" th:field="*{price}" placeholder="0.00" step="0.01" min="0" required />
              <div class="error-message" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
            </div>

            <div>
              <label class="mb-2 block text-sm font-semibold text-slate-700" for="description"><i class="fas fa-align-left mr-2 text-indigo-500"></i>Description</label>
              <textarea class="input-field w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-800 outline-none" id="description" th:field="*{description}" rows="5" placeholder="Describe the product in a few words" required minlength="10"></textarea>
              <div class="error-message" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>
          </div>

          <div class="space-y-6">
            <div class="rounded-2xl border border-dashed border-slate-300 bg-slate-50 p-4">
              <label class="mb-3 block text-sm font-semibold text-slate-700" for="imageFile"><i class="fas fa-image mr-2 text-indigo-500"></i>Product image</label>
              <label class="flex min-h-[240px] cursor-pointer flex-col items-center justify-center rounded-2xl border-2 border-dashed border-slate-300 bg-white p-6 text-center transition hover:border-indigo-400 hover:bg-indigo-50" id="fileUploadArea">
                <div id="uploadPrompt" class="flex flex-col items-center">
                  <div class="mb-3 rounded-full bg-indigo-100 p-4 text-indigo-600"><i class="fas fa-cloud-upload-alt text-3xl"></i></div>
                  <p class="text-sm font-medium text-slate-700">Upload product image</p>
                  <p class="mt-1 text-xs text-slate-500">PNG, JPG, GIF up to 5MB</p>
                </div>
                <div id="fileInfo" class="hidden flex-col items-center">
                  <div class="mb-3 rounded-full bg-emerald-100 p-4 text-emerald-600"><i class="fas fa-file-image text-3xl"></i></div>
                  <p id="fileName" class="text-sm font-semibold text-slate-700"></p>
                  <p class="mt-1 text-xs text-slate-500">Click to change</p>
                </div>
                <input type="file" id="imageFile" name="imageFile" th:field="*{imageFile}" class="hidden" accept="image/*" required />
              </label>
              <div class="mt-3 text-center text-xs text-slate-500" id="selectedFileName"></div>
              <div class="error-message" th:if="${#fields.hasErrors('imageFile')}" th:errors="*{imageFile}"></div>
            </div>

            <div class="flex gap-3 pt-2">
              <a href="/products" class="inline-flex flex-1 items-center justify-center rounded-xl border border-slate-200 bg-slate-100 px-4 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-200">
                <i class="fas fa-times mr-2"></i>Cancel
              </a>
              <button type="submit" class="inline-flex flex-1 items-center justify-center rounded-xl bg-gradient-to-r from-indigo-600 to-blue-600 px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-indigo-200 transition hover:shadow-xl">
                <i class="fas fa-check mr-2"></i>Submit
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <script>
      const fileInput = document.getElementById('imageFile');
      const fileUploadArea = document.getElementById('fileUploadArea');
      const uploadPrompt = document.getElementById('uploadPrompt');
      const fileInfo = document.getElementById('fileInfo');
      const fileNameDisplay = document.getElementById('fileName');
      const selectedFileName = document.getElementById('selectedFileName');
      const form = document.getElementById('productForm');

      fileInput.addEventListener('change', function () {
        if (this.files && this.files[0]) {
          const fileName = this.files[0].name;
          uploadPrompt.classList.add('hidden');
          fileInfo.classList.remove('hidden');
          fileInfo.classList.add('flex');
          fileNameDisplay.textContent = fileName;
          selectedFileName.textContent = `Selected file: ${fileName}`;

          const errorDiv = document.querySelector('[th\\:errors="*{imageFile}"]');
          if (errorDiv) {
            errorDiv.textContent = '';
          }
        }
      });

      ['dragenter', 'dragover', 'dragleave', 'drop'].forEach((eventName) => {
        fileUploadArea.addEventListener(eventName, (e) => {
          e.preventDefault();
          e.stopPropagation();
        }, false);
      });

      ['dragenter', 'dragover'].forEach((eventName) => {
        fileUploadArea.addEventListener(eventName, () => fileUploadArea.classList.add('border-indigo-400', 'bg-indigo-50'), false);
      });

      ['dragleave', 'drop'].forEach((eventName) => {
        fileUploadArea.addEventListener(eventName, () => fileUploadArea.classList.remove('border-indigo-400', 'bg-indigo-50'), false);
      });

      fileUploadArea.addEventListener('drop', (e) => {
        const files = e.dataTransfer.files;
        fileInput.files = files;
        fileInput.dispatchEvent(new Event('change'));
      }, false);

      form.addEventListener('submit', function (e) {
        let isValid = true;
        const description = document.getElementById('description');

        if (description.value.trim().length < 10) {
          isValid = false;
          let errorDiv = description.nextElementSibling;
          if (!errorDiv || !errorDiv.classList.contains('error-message')) {
            errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            description.parentNode.insertBefore(errorDiv, description.nextSibling);
          }
          errorDiv.textContent = 'The description should be at least 10 characters.';
        }

        if (!fileInput.files || fileInput.files.length === 0) {
          isValid = false;
          const errorDiv = document.querySelector('[th\\:errors="*{imageFile}"]');
          if (errorDiv) {
            errorDiv.textContent = 'The image file is required.';
          }
        }

        if (!isValid) {
          e.preventDefault();
        }
      });
    </script>
  </body>
</html>
