<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BestStore | Products</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      body {
        background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 35%, #e0f2fe 100%);
      }
      .alert-message {
        transition: opacity 0.5s ease-in-out;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(8px);
      }
    </style>
  </head>
  <body class="min-h-screen text-slate-800">
    <div class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
      <header class="glass-card mb-8 rounded-3xl border border-white/60 shadow-lg shadow-slate-200/80">
        <div class="flex flex-col gap-5 px-6 py-6 md:flex-row md:items-center md:justify-between">
          <div>
            <p class="text-xs font-semibold uppercase tracking-[0.24em] text-indigo-500">Inventory</p>
            <h1 class="mt-2 text-3xl font-black tracking-tight text-slate-900">BestStore catalog</h1>
          </div>
          <a href="/products/create" class="inline-flex items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-indigo-600 to-blue-600 px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-indigo-200 transition hover:-translate-y-0.5 hover:shadow-xl">
            <i class="fas fa-plus"></i>
            Add product
          </a>
        </div>
      </header>

      <div th:if="${message}" class="alert-message mb-5 rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-700 shadow-sm" role="alert" id="successMessage">
        <div class="flex items-center gap-2">
          <i class="fas fa-circle-check"></i>
          <span th:text="${message}"></span>
        </div>
      </div>
      <div th:if="${error}" class="alert-message mb-5 rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700 shadow-sm" role="alert" id="errorMessage">
        <div class="flex items-center gap-2">
          <i class="fas fa-circle-exclamation"></i>
          <span th:text="${error}"></span>
        </div>
      </div>

      <section class="mb-8 grid gap-4 md:grid-cols-2 xl:grid-cols-4">
        <div class="rounded-2xl border border-indigo-100 bg-white p-5 shadow-sm shadow-indigo-100">
          <div class="flex items-center justify-between">
            <p class="text-sm font-medium text-slate-500">Total products</p>
            <div class="rounded-xl bg-indigo-100 p-2 text-indigo-600"><i class="fas fa-boxes"></i></div>
          </div>
          <p class="mt-4 text-3xl font-black text-slate-900" th:text="${inventorySummary.totalProducts}">0</p>
        </div>
        <div class="rounded-2xl border border-emerald-100 bg-white p-5 shadow-sm shadow-emerald-100">
          <div class="flex items-center justify-between">
            <p class="text-sm font-medium text-slate-500">Inventory value</p>
            <div class="rounded-xl bg-emerald-100 p-2 text-emerald-600"><i class="fas fa-dollar-sign"></i></div>
          </div>
          <p class="mt-4 text-3xl font-black text-slate-900" th:text="' $' + ${#numbers.formatDecimal(inventorySummary.totalValue, 1, 2)}">$0.00</p>
        </div>
        <div class="rounded-2xl border border-violet-100 bg-white p-5 shadow-sm shadow-violet-100">
          <div class="flex items-center justify-between">
            <p class="text-sm font-medium text-slate-500">Average price</p>
            <div class="rounded-xl bg-violet-100 p-2 text-violet-600"><i class="fas fa-chart-line"></i></div>
          </div>
          <p class="mt-4 text-3xl font-black text-slate-900" th:text="' $' + ${#numbers.formatDecimal(inventorySummary.averagePrice, 1, 2)}">$0.00</p>
        </div>
        <div class="rounded-2xl border border-amber-100 bg-white p-5 shadow-sm shadow-amber-100">
          <div class="flex items-center justify-between">
            <p class="text-sm font-medium text-slate-500">Top product</p>
            <div class="rounded-xl bg-amber-100 p-2 text-amber-600"><i class="fas fa-star"></i></div>
          </div>
          <p class="mt-4 text-lg font-bold text-slate-900" th:if="${inventorySummary.newestProduct != null}" th:text="${inventorySummary.newestProduct.name}">Product</p>
          <p class="mt-4 text-lg font-bold text-slate-900" th:unless="${inventorySummary.newestProduct != null}">No products</p>
        </div>
      </section>

      <section class="mb-8 rounded-3xl border border-white/60 bg-white/70 p-4 shadow-lg shadow-slate-200/60 backdrop-blur-sm">
        <form action="/products" method="get" class="flex flex-col gap-3 md:flex-row md:items-center">
          <div class="relative flex-1">
            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" name="keyword" th:value="${keyword}" placeholder="Search by product, brand, or category" class="w-full rounded-xl border border-slate-200 bg-white py-3 pl-11 pr-4 text-sm text-slate-700 outline-none transition focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100" />
          </div>
          <button type="submit" class="inline-flex items-center justify-center gap-2 rounded-xl bg-slate-900 px-5 py-3 text-sm font-semibold text-white transition hover:bg-slate-800">
            <i class="fas fa-search"></i>
            Search
          </button>
          <a th:if="${keyword}" href="/products" class="inline-flex items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-5 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-50">
            <i class="fas fa-xmark"></i>
            Clear
          </a>
        </form>

        <div th:if="${keyword}" class="mt-3 text-sm text-slate-600">
          <span>Showing results for <strong th:text="${keyword}"></strong></span>
          <span class="ml-2 text-slate-500">(<span th:text="${#lists.size(products)}"></span> products found)</span>
        </div>
      </section>

      <section class="grid gap-6 md:grid-cols-2 xl:grid-cols-4">
        <div th:if="${#lists.isEmpty(products)}" class="col-span-full rounded-3xl border border-dashed border-slate-300 bg-white/60 py-16 text-center shadow-sm">
          <div class="mb-4 text-slate-300"><i class="fas fa-box-open text-6xl"></i></div>
          <p class="text-lg font-medium text-slate-600" th:text="${keyword} ? 'No products found matching your search.' : 'No products available.'">No products available.</p>
          <a th:if="${keyword}" href="/products" class="mt-4 inline-flex items-center gap-2 text-sm font-semibold text-indigo-600 hover:text-indigo-800">
            <i class="fas fa-arrow-left"></i>
            View all products
          </a>
        </div>

        <div th:each="product : ${products}" class="group overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm shadow-slate-200 transition duration-200 hover:-translate-y-1 hover:shadow-xl">
          <div class="relative h-52 bg-gradient-to-br from-slate-50 via-white to-indigo-50 p-4">
            <div class="absolute right-3 top-3 rounded-full bg-white/90 px-2.5 py-1 text-[10px] font-semibold uppercase tracking-[0.2em] text-slate-500 shadow-sm">
              <span th:text="${product.category}"></span>
            </div>
            <div class="flex h-full items-center justify-center">
              <img th:if="${product.imageFileName}" th:src="@{'/images/' + ${product.imageFileName}}" alt="Product Image" class="h-36 w-36 object-contain rounded-2xl bg-white p-2 shadow-sm" />
              <div th:unless="${product.imageFileName}" class="flex h-36 w-36 items-center justify-center rounded-2xl bg-slate-100 text-slate-300 shadow-inner">
                <i class="fas fa-image text-4xl"></i>
              </div>
            </div>
          </div>

          <div class="space-y-4 p-5">
            <div class="flex items-start justify-between gap-3">
              <div>
                <p class="text-[11px] font-semibold uppercase tracking-[0.2em] text-slate-400">Product</p>
                <h3 class="mt-1 text-xl font-bold text-slate-900">
                  <a th:href="@{/products/view(id=${product.id})}" class="hover:text-indigo-600 transition" th:text="${product.name}"></a>
                </h3>
              </div>
              <span class="rounded-full bg-indigo-50 px-2 py-1 text-xs font-semibold text-indigo-700">#<span th:text="${product.id}"></span></span>
            </div>

            <div class="flex items-center justify-between text-sm">
              <span class="font-medium text-slate-600" th:text="${product.brand}"></span>
              <span class="text-slate-400">•</span>
              <span class="font-medium text-slate-500" th:text="${product.category}"></span>
            </div>

            <div class="flex items-center justify-between">
              <p class="text-2xl font-black text-indigo-600" th:text="' $' + ${#numbers.formatDecimal(product.price, 1, 2)}">$0.00</p>
              <span class="text-xs font-medium text-slate-400" th:text="${#temporals.format(product.createdAt, 'yyyy-MM-dd')}"></span>
            </div>

            <div class="flex gap-2 pt-2">
              <a th:href="@{/products/view(id=${product.id})}" class="flex-1 rounded-xl bg-emerald-500 px-3 py-2 text-center text-sm font-semibold text-white transition hover:bg-emerald-600">
                <i class="fas fa-eye mr-1"></i>View
              </a>
              <a th:href="@{/products/edit(id=${product.id})}" class="flex-1 rounded-xl bg-blue-500 px-3 py-2 text-center text-sm font-semibold text-white transition hover:bg-blue-600">
                <i class="fas fa-pen mr-1"></i>Edit
              </a>
              <a th:href="@{/products/delete(id=${product.id})}" onclick="return confirm('Are you sure you want to delete this product?')" class="flex-1 rounded-xl bg-rose-500 px-3 py-2 text-center text-sm font-semibold text-white transition hover:bg-rose-600">
                <i class="fas fa-trash mr-1"></i>Delete
              </a>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const successMessage = document.getElementById("successMessage");
        const errorMessage = document.getElementById("errorMessage");

        function hideMessage(element) {
          if (element) {
            setTimeout(() => {
              element.style.opacity = "0";
              setTimeout(() => element.remove(), 500);
            }, 5000);
          }
        }

        hideMessage(successMessage);
        hideMessage(errorMessage);
      });
    </script>
  </body>
</html>
